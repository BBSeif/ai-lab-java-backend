spring:
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  datasource:
    url: jdbc:postgresql://localhost:5432/aiproject
    username: aiproject
    password: aiproject
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true



springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

