services:
  postgres:
    image: postgres:16
    container_name: aiproject-db
    environment:
      POSTGRES_DB: aiproject
      POSTGRES_USER: aiproject
      POSTGRES_PASSWORD: aiproject
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiproject -d aiproject"]
      interval: 5s
      retries: 10

volumes:
  pgdata: